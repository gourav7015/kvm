[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/identity",
    "crates/discovery",
    "crates/net",
    "crates/input",
    "crates/clipboard",
    "crates/transfer",
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
