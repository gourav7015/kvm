[package]
name = "kvm-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
flume = "0.12.0"
hex = "0.4.3"
kvm-protocol = { version = "0.1.0", path = "../protocol" }
mdns-sd = "0.21.3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "time", "rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
kvm-identity = { path = "../identity" }
tokio = { version = "1.53.1", features = ["test-util"] }
