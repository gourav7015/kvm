[package]
name = "kvm-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc", "rand_core"] }
kvm-identity = { version = "0.1.0", path = "../identity" }
kvm-protocol = { version = "0.1.0", path = "../protocol" }
quinn = "0.11.11"
rcgen = "0.14.10"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
